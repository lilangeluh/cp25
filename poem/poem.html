<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Everyday Object Poem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=Kode+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="poem.css" />
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>Everyday Object Poem</h1>
      <p>an image drifts in, a small poem drifts out</p>
    </header>

    <section class="panel" id="card" aria-live="polite">
      <input id="fileInput" type="file" accept="image/*" hidden />

      <button class="imageBox" id="imageBox" type="button" aria-label="Upload an image">
        <img id="previewImg" alt="Uploaded object" />
        <div class="placeholder" id="placeholder">Drop image here or click to upload</div>
      </button>

      <p class="caption" id="captionText"></p>

      <div class="buttons">
        <button class="btn btnPrimary" id="generateBtn" type="button">Generate Poem</button>
        <button class="btn" id="shuffleBtn" type="button">Shuffle Background</button>
        <button class="btn" id="saveBtn" type="button">Save</button>
      </div>
    </section>
  </main>

  <canvas id="renderCanvas" width="1200" height="1820" hidden></canvas>
  <div class="toast" id="toast"></div>

  <script src="poem.js"></script>
</body>
</html>
