<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Album</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="album.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
</head>
<body>
  <div class="album-scene">
    <div class="book-shadow-top"></div>
    <div class="book-shadow"></div>
    <div class="page-stack page-stack-left" id="pageStackLeft"></div>
    <div class="page-stack page-stack-right" id="pageStackRight"></div>

    <div id="flipbook">
      <!-- Pages generated by album.js -->
    </div>
  </div>

  <div class="nav-controls">
    <button class="nav-btn" id="prevBtn" aria-label="Previous spread">‹</button>
    <div class="page-indicators" id="indicators"></div>
    <button class="nav-btn" id="nextBtn" aria-label="Next spread">›</button>
  </div>

  <script src="album.js"></script>
</body>
</html>
